<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 320px; padding: 16px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { color: #666; line-height: 1.45; }
  input { box-sizing: border-box; width: 100%; padding: 8px; margin: 6px 0 10px; }

<input id="token" autocomplete="off" placeholder="一次性口令">
<button id="send">发送登录态和密码</button>
<div id="status"></div>
