<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lemon 支持</title>
  <style>
    body { margin: 0; color: #1d1d1f; background: #fff; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
    h1 { font-size: 36px; letter-spacing: -.02em; }
    h2 { margin-top: 36px; font-size: 22px; }
    a { color: #06c; }
  </style>
</head>
<body><main>
  <h1>Lemon 支持</h1>
  <p>Lemon 是一款原生 macOS WebKit 浏览器。使用问题、兼容性反馈和功能建议可提交到公开问题跟踪页面。</p>
  <h2>获取帮助</h2>
  <p><a href="https://github.com/w3345137/lemon-browser/issues">提交问题或查看已有问题</a></p>
  <p>反馈时请提供 macOS 版本、Lemon 版本、问题复现步骤和不含隐私信息的截图。请勿提交密码、Cookie、内网地址、真实账号或其他敏感资料。</p>
  <h2>常见处理</h2>
  <p>网站显示异常时，可先刷新页面或清除该网站数据。摄像头、麦克风或外部 App 无法使用时，请检查 Lemon 的网站权限以及 macOS“隐私与安全性”设置。</p>
  <h2>隐私</h2>
  <p>请参阅 <a href="privacy.html">Lemon 隐私政策</a>。</p>
</main></body>
</html>
